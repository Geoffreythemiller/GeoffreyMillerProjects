name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  risk-modeling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: risk-modeling/requirements.txt
      - name: Install dependencies
        run: pip install -r risk-modeling/requirements.txt
      - name: Run risk-modeling tests
        working-directory: risk-modeling
        run: pytest tests/ -q

name: Planetoids smoke

on:
  push:
    branches: [main]
    paths:
      - "school-projects/planetoids/**"
      - ".github/workflows/planetoids-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "school-projects/planetoids/**"
      - ".github/workflows/planetoids-smoke.yml"

jobs:
  planetoids-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-projects/planetoids
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: school-projects/planetoids/requirements.txt
      - name: Install Kivy/SDL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmtdev1 libgl1 libglib2.0-0 libsm6 libxrender1 libxext6 \
            libgstreamer1.0-0 libpulse0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import smoke test (non-interactive)
        env:
          KIVY_GL_BACKEND: mock
          KIVY_NO_CONSOLELOG: "1"
        run: |
          python -c "from consts import GAME_WIDTH, GAME_HEIGHT; from app import Planetoids; print('planetoids smoke ok', GAME_WIDTH, GAME_HEIGHT)"

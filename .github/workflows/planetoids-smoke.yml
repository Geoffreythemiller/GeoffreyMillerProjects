name: Planetoids smoke

on:
  push:
    branches: [main]
    paths:
      - "school-projects/planetoids/**"
      - ".github/workflows/planetoids-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "school-projects/planetoids/**"
      - ".github/workflows/planetoids-smoke.yml"

jobs:
  planetoids-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-projects/planetoids
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: school-projects/planetoids/requirements.txt
      - name: Install system dependencies (Kivy headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libmtdev1t64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import smoke test (non-interactive)
        env:
          SDL_VIDEODRIVER: x11
        run: |
          xvfb-run -a python -c "from consts import GAME_WIDTH, GAME_HEIGHT; from app import Planetoids; print('planetoids smoke ok', GAME_WIDTH, GAME_HEIGHT)"
